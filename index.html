<!DOCTYPE html>

<html>
  <head>
    <title>Worm Game</title>
    <!-- Favicon: prefer the rasterised PNG (Fredoka baked into the
         glyphs), fall back to the legacy ICO for old browsers and to
         the SVG for vector-capable ones that ignore the PNG. -->
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
    <link rel="alternate icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser-arcade-physics.min.js"></script>
    <!-- Firebase: Auth (Google sign-in) + Firestore (per-user stats). -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
        from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
      import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp, increment }
        from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";


      const firebaseConfig = {

  apiKey: "AIzaSyA2LKtkUF580OX4zBxOB_rw3UfMcUjg5no",

  authDomain: "worm-game-bdd29.firebaseapp.com",

  projectId: "worm-game-bdd29",

  storageBucket: "worm-game-bdd29.firebasestorage.app",

  messagingSenderId: "645517475620",

  appId: "1:645517475620:web:17217da083f0065730bdb1",

  measurementId: "G-6NGQQXZ01X"

};


      try {
        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);
        window.WG_AUTH = {
          auth, db,
          provider: new GoogleAuthProvider(),
          signInWithPopup, signOut, onAuthStateChanged,
          doc, getDoc, setDoc, updateDoc, serverTimestamp, increment,
        };
      } catch (e) {
        console.warn("Firebase init failed (config probably still placeholder):", e);
      }
    </script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6NGQQXZ01X"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-6NGQQXZ01X');
</script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1e1e2e;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Keep mobile pinch-zoom and drag-to-scroll working when the
         gesture starts over the game canvas. Phaser sets
         touch-action:none inline; !important wins over that. */
      #game canvas { touch-action: auto !important; }
      /* Phaser's canvas paints black for the first frame or two
         before the configured backgroundColor takes effect, and
         the canvas sits on top of any #game-div bg so colouring
         the div alone isn't enough. Hide the canvas outright until
         main.js has confirmed Phaser has rendered at least one
         frame; #game's matching bg fills the gap until then. */
      #game           { background: #1e1e2e; }
      #game canvas    { background: #1e1e2e; visibility: hidden; }
      #game.wg-ready canvas { visibility: visible; }
    </style>
    </head>

    <body>
        <div id="game"></div>
        <!-- Game classes. The ?v= query string is a cache-buster:
             every deploy must bump WG_VER so returning visitors get
             the new JS instead of a stale cached copy. The CDN
             scripts above (Phaser, Firebase, gtag) version themselves. -->
        <script>window.WG_VER = '20260519i';</script>
        <script>
          document.write(
            ['js/boot.js',
             'js/backend/word_logic.js',
             'js/ui/settings.js',
             'js/ui/game_mode_settings.js',
             'js/ui/game.js',
             'js/ui/intro.js',
             'js/main.js']
            .map(s => '<script src="' + s + '?v=' + window.WG_VER + '"><\/script>').join('')
          );
        </script>
    </body>
</html>
